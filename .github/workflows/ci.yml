name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: referral_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d referral_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/referral_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm test --prefix server
      - run: node --check server/worker.js
      - run: npm run build --prefix client
      - run: npm audit --prefix server --audit-level=high
      - run: npm audit --prefix client --audit-level=high
      - run: docker build -t referral-operations:test .
      - uses: gitleaks/gitleaks-action@v2
